name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          # DL3008 (pin apt versions): the base image moves with Ubuntu, so
          #         versions are not pinned.
          # DL3009 (clean apt lists after install): the lists are cleaned
          #         once per phase, not after each layer, which keeps the
          #         multi-phase pattern readable.
          # SC2086 (unquoted $WANT): word splitting expands the package
          #         wishlist into individual arguments.
          ignore: DL3008,DL3009,SC2086
          failure-threshold: warning

  shellcheck:
    name: ShellCheck (shell scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # All shell scripts shipped in the image: *.sh, the extensionless
          # s6-rc.d service scripts (run), the session starter and the openbox
          # autostart. Shebangs are honoured (no forced --shell); the
          # with-contenv scripts carry a "shellcheck shell=bash" directive.
          SCRIPTS=$(find rootfs -type f \( -name '*.sh' -o -name 'run' -o -name 'autostart' -o -name 'krusader-session' \))

          if [ -z "${SCRIPTS}" ]; then
            echo "ERROR: no shell scripts found, the find pattern is broken." >&2
            exit 1
          fi

          echo "Checking the following scripts:"
          echo "${SCRIPTS}"
          echo "---"

          # -S warning: fail on warnings and up
          # -x:         follow sourced files
          # -e SC1091:  allow sourcing files not present at lint time
          # shellcheck disable=SC2086
          shellcheck -S warning -x -e SC1091 ${SCRIPTS}

          echo "All scripts passed shellcheck."

  session-tests:
    name: Session script behaviour
    runs-on: ubuntu-latest
    # The tests wait on real signals and sleeps; a hang must not sit in the
    # queue for the 6 h job default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run behaviour tests
        # krusader-session: restart-after-quit, no restart after SIGTERM, the
        # quit-before-signal order and both spin guards, all against a stub
        # krusader on PATH. krusader-resolution: which screen size wins and
        # what happens to a malformed one.
        run: |
          bash tests/test-krusader-session.sh
          bash tests/test-krusader-resolution.sh

  xml-validate:
    name: XML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate XML files
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          for f in $(find . -name '*.xml' -not -path './.git/*'); do
            echo "Checking $f"
            xmllint --noout "$f"
          done
